<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kiểm tra trực tuyến STK</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
/* Bố cục: thanh đầu trang + vùng làm việc một cột; giao diện giáo viên dạng thẻ, bài thi dạng "giấy" chữ có chân. */
:root{
  --bg:#F3F5F9;--surface:#FFFFFF;--surface-2:#EDF1F8;--ink:#16233F;--ink-2:#51607D;--line:#D6DDEA;
  --blue:#1D4F9E;--blue-ink:#FFFFFF;--blue-soft:#E4ECFA;
  --red:#C4352B;--red-soft:#FBE9E7;
  --green:#1B7A4B;--green-soft:#E1F3EA;
  --amber:#8A5200;--amber-soft:#FFF1D6;
  --shadow:0 1px 2px rgba(22,35,63,.06),0 8px 24px rgba(22,35,63,.07);
  --f-ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-paper:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1524;--surface:#16203A;--surface-2:#1C2848;--ink:#E8EDF8;--ink-2:#9FB0D2;--line:#2B3A5E;
    --blue:#8DB4F5;--blue-ink:#0B1630;--blue-soft:#1D2D52;
    --red:#FF8A7E;--red-soft:#3A1E24;
    --green:#6FD3A0;--green-soft:#133425;
    --amber:#F2B65C;--amber-soft:#3A2D10;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1524;--surface:#16203A;--surface-2:#1C2848;--ink:#E8EDF8;--ink-2:#9FB0D2;--line:#2B3A5E;
  --blue:#8DB4F5;--blue-ink:#0B1630;--blue-soft:#1D2D52;
  --red:#FF8A7E;--red-soft:#3A1E24;
  --green:#6FD3A0;--green-soft:#133425;
  --amber:#F2B65C;--amber-soft:#3A2D10;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-ui);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3{font-family:var(--f-paper);font-weight:700;line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:1.9rem}h2{font-size:1.35rem}h3{font-size:1.1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;text-decoration:none;color:inherit}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--f-paper);font-size:1.12rem;line-height:1.2}
.brand small{display:block;color:var(--ink-2);font-size:.76rem;line-height:1.3}
nav{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
nav button{border:0;background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500}
nav button:hover{background:var(--surface-2)}
nav button[aria-current="page"]{background:var(--blue-soft);color:var(--blue);font-weight:600}
main{padding-block:22px 40px;min-height:60vh}
footer{border-top:1px solid var(--line);color:var(--ink-2);font-size:.8rem;padding-block:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
footer .wrap{display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:space-between}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card+.card{margin-top:16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grow{flex:1 1 200px}
.muted{color:var(--ink-2)}.small{font-size:.84rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.stack>*+*{margin-top:12px}
.hero{padding:10px 0 22px;max-width:640px}
.hero p{margin-top:8px;color:var(--ink-2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:500;line-height:1.2;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--blue-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 10px;font-size:.85rem;border-radius:7px}
.btn.lg{padding:13px 22px;font-size:1.02rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.82rem;color:var(--ink-2);font-weight:500}
input[type=text],input[type=number],input[type=password],input[type=datetime-local],input[type=search],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
textarea{resize:vertical;line-height:1.5}
input[type=checkbox],input[type=radio]{accent-color:var(--blue);width:17px;height:17px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;font-weight:700}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.banner{border:1px solid var(--line);background:var(--blue-soft);border-radius:10px;padding:10px 14px;font-size:.88rem}
.banner.warn{background:var(--amber-soft);border-color:var(--amber);color:var(--ink)}
.banner.bad{background:var(--red-soft);border-color:var(--red)}
.empty{text-align:center;padding:36px 16px;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-family:var(--f-paper);font-size:1.1rem;margin-bottom:4px}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right}
tr.hl td{background:var(--blue-soft)}
.score{font-family:var(--f-paper);font-weight:700;color:var(--red)}

/* lớp & học sinh */
.cls h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkrow{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.linkrow input{flex:1 1 240px;font-size:.85rem}
.stulist input{padding:5px 8px}

/* soạn đề */
.qc{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.qc+.qc{margin-top:12px}
.qc header{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qc header b{font-family:var(--f-paper);margin-right:auto}
.qc header select{width:auto;padding:4px 8px}
.secbar{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.secbar h3{font-size:1.05rem}
.opt-edit{display:flex;gap:8px;align-items:flex-start;margin-top:6px}
.opt-edit>b{width:22px;flex:none;padding-top:9px;text-align:center}
.opt-edit .grow{flex:1 1 0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.thumb{position:relative;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff;max-width:100%}
.thumb img{display:block;max-height:150px;max-width:100%}
.thumb button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;line-height:1;color:var(--red)}
.keybtn{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.keybtn button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-weight:600}
.keybtn button+button{border-left:1px solid var(--line)}
.keybtn button.on.t{background:var(--green);color:#fff}
.keybtn button.on.f{background:var(--red);color:#fff}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;background:var(--surface-2)}
.dropzone.over{border-color:var(--blue);background:var(--blue-soft)}
.sticky-act{position:sticky;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px 0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sums{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.sums .cell{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sums .cell h4{margin:0 0 6px;font-size:.92rem}
.mode{display:flex;gap:12px;flex-wrap:wrap;font-size:.86rem;margin-bottom:6px}
.mode label{display:flex;gap:5px;align-items:center}

/* bài thi (giấy) */
.exam{max-width:820px;margin:0 auto}
.examhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:var(--shadow)}
.timer{font-family:var(--f-paper);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.palette .grp{width:100%;font-size:.78rem;color:var(--ink-2);font-weight:600;margin-top:4px}
.chip{min-width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.chip.done{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px;font-family:var(--f-paper);font-size:1.06rem;line-height:1.65}
.paper .secbar{font-family:var(--f-ui)}
.paper .secbar h3{font-family:var(--f-paper)}
.sq{padding:16px 0;border-bottom:1px dashed var(--line);scroll-margin-top:120px}
.sq:last-child{border-bottom:0}
.sq .qt{white-space:pre-wrap;overflow-wrap:anywhere}
.sq .qt b{font-family:var(--f-ui);color:var(--red);margin-right:6px}
.sq img.fig{display:block;max-width:100%;margin:10px 0;background:#fff;border-radius:4px}
.opts{display:grid;gap:8px;margin-top:10px}
.opts.cols{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;cursor:pointer;width:100%;font-family:var(--f-paper);font-size:1.02rem;line-height:1.5}
.opt:hover{background:var(--surface-2)}
.opt .lt{flex:none;width:26px;height:26px;border-radius:99px;border:1.5px solid var(--ink-2);display:grid;place-items:center;font:600 .82rem var(--f-ui)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.sel .lt{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.opt span.tx{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.opt img{display:block;max-width:100%;margin-top:6px}
.tfrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.tfrow .tx{flex:1 1 260px;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.tfrow .keybtn button{font-family:var(--f-ui)}
.tfrow .keybtn button.on{background:var(--blue);color:var(--blue-ink)}
.paper input[type=text],.paper textarea{font-family:var(--f-ui)}
.result{max-width:520px;margin:30px auto;text-align:center;padding:30px 20px}
.result .big{font-family:var(--f-paper);font-size:4.2rem;font-weight:700;color:var(--red);line-height:1.1;margin:10px 0}
.result .big small{font-size:1.4rem;color:var(--ink-2)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px;margin-top:12px}
.names .btn{justify-content:flex-start;text-align:left}

/* phân tích */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.tile small{display:block;color:var(--ink-2);font-size:.76rem;font-weight:600}
.tile b{font-family:var(--f-paper);font-size:1.5rem;font-variant-numeric:tabular-nums}
.hist{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px}
.hist .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.hist .col i{display:block;width:100%;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.hist .col span{font-size:.72rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hist .col em{font-style:normal;font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums}
.hbar{display:grid;grid-template-columns:minmax(70px,150px) 1fr 52px;gap:8px;align-items:center;margin:6px 0;font-size:.86rem}
.hbar .tr{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--blue);border-radius:99px}
.hbar .tr i.g{background:var(--green)}.hbar .tr i.r{background:var(--red)}.hbar .tr i.a{background:var(--amber)}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
.ok-t{color:var(--green);font-weight:600}.bad-t{color:var(--red);font-weight:600}
.chs span{display:inline-block;margin-right:8px;white-space:nowrap}
.chs .k{font-weight:700;color:var(--green)}

/* hộp thoại, thông báo */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(10,18,36,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:760px;margin:auto;padding:18px}
.modal.wide{max-width:980px}
.modal h3{margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:min(92vw,520px);font-size:.9rem;box-shadow:var(--shadow)}
.toast.bad{background:var(--red);color:#fff}
.cropbox{position:relative;display:inline-block;max-width:100%;touch-action:none;cursor:crosshair;line-height:0}
.cropbox img{max-width:100%;display:block;user-select:none;-webkit-user-drag:none}
.cropbox .sel{position:absolute;border:2px solid var(--red);background:rgba(196,53,43,.18);pointer-events:none}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:99px;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:560px){
  h1{font-size:1.5rem}
  .paper{padding:14px}
  .hbar{grid-template-columns:70px 1fr 46px}
  .examhead{padding:8px 10px}
}
.two+.card,.card+.two,.two+.two{margin-top:16px}

</style>
<script src="config.js"></script>
</head><body>
<header class="top"><div class="wrap topin"><a class="brand" data-a="home" href="#" aria-label="Trang đầu"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="var(--blue)"/><path d="M9 11h16M9 17h16M9 23h9" stroke="var(--blue-ink)" stroke-width="2.4" stroke-linecap="round"/><path d="M21 23.5l2.4 2.4 4.2-5" stroke="var(--blue-ink)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span><b>Kiểm tra trực tuyến STK</b><small>Thầy soạn STK · Trường THPT Phạm Văn Đồng, Phước Hậu</small></span></a><nav id="nav" aria-label="Menu"></nav></div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap"><span>Tác giả: Thầy soạn STK</span><span>Trường Trung học phổ thông Phạm Văn Đồng, Phước Hậu</span></div></footer>
<script>
'use strict';
/* ===== core.js: tiện ích, tách đề, chấm điểm, phân tích (không dùng DOM) ===== */
const SECS = ['p1', 'p2', 'p3', 'p4'];
const SECT = {
  p1: { roman: 'I', short: 'Nhiều lựa chọn', title: 'Câu trắc nghiệm nhiều phương án lựa chọn', hint: 'Mỗi câu chỉ chọn một phương án.' },
  p2: { roman: 'II', short: 'Đúng / Sai', title: 'Câu trắc nghiệm đúng sai', hint: 'Trong mỗi câu, chọn Đúng hoặc Sai cho từng ý a), b), c), d).' },
  p3: { roman: 'III', short: 'Trả lời ngắn', title: 'Câu trắc nghiệm trả lời ngắn', hint: 'Nhập đáp án (số hoặc chữ ngắn) vào ô trả lời.' },
  p4: { roman: 'IV', short: 'Tự luận', title: 'Tự luận', hint: 'Trình bày bài làm bằng chữ, hoặc chụp ảnh bài làm rồi tải lên.' }
};
let _uc = 0;
const uid = () => 'x' + Date.now().toString(36) + (_uc++).toString(36) + Math.random().toString(36).slice(2, 6);
const CODECH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const code6 = () => { let s = ''; for (let i = 0; i < 6; i++) s += CODECH[Math.floor(Math.random() * CODECH.length)]; return s; };
const clone = o => (o == null ? o : JSON.parse(JSON.stringify(o)));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = a => a.reduce((x, y) => x + y, 0);
const fmt = (n, d = 2) => {
  if (n == null || isNaN(n)) return '–';
  const p = Math.pow(10, d);
  return String(Math.round(n * p) / p).replace('.', ',');
};
function hashStr(s) { let h = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); } return h >>> 0; }
function rng(seed) { let a = hashStr(seed); return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffled(arr, seed) { const a = arr.slice(), r = rng(seed); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function nameKey(s) { return String(s || '').normalize('NFC').toLowerCase().replace(/\s+/g, ' ').trim(); }
function viSort(a, b) { return String(a).localeCompare(String(b), 'vi'); }
/* Tên Việt: sắp theo tên (từ cuối), rồi cả họ tên */
function byViName(a, b) {
  const la = String(a.n || a).trim().split(/\s+/), lb = String(b.n || b).trim().split(/\s+/);
  return viSort(la[la.length - 1], lb[lb.length - 1]) || viSort(String(a.n || a), String(b.n || b));
}

/* ---------- Chấm câu trả lời ngắn ---------- */
/* Câu trả lời ngắn: chỉ chấp nhận dấu phẩy làm dấu thập phân (12,4). Có dấu chấm thì không phải số hợp lệ. */

/* ---------- Thang điểm ---------- */
const DEFAULT_SC = () => ({ p1: { mode: 'per', v: 0.25 }, p2: { scale: [0, 0.1, 0.25, 0.5, 1] }, p3: { mode: 'per', v: 0.5 }, p4: { mode: 'per', v: 1 } });

/* ---------- Chấm bài ---------- */
function gradeSub(exam, qs, keys, sub) {

}

/* ---------- Phân tích ---------- */
function levelOf(s10) { return s10 >= 8 ? 'Giỏi' : s10 >= 6.5 ? 'Khá' : s10 >= 5 ? 'Trung bình' : 'Yếu'; }

}

/* ---------- Tách đề từ danh sách dòng ---------- */
const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '+': '⁺', '-': '⁻', '=': '⁼', '(': '⁽', ')': '⁾', 'n': 'ⁿ', 'i': 'ⁱ' };

const NUMS = { I: 1, II: 2, III: 3, IV: 4, '1': 1, '2': 2, '3': 3, '4': 4 };
function secFromText(s) {

const RE_Q = /^\s*(?:Câu|CÂU|Bài|BÀI|Question|QUESTION)\s*(\d{1,3})\s*[.:)\-–]*\s*(.*)$/;

function parseExam(lines) {

  const hasCau = lines.some(l => RE_Q.test(l.t || ''));

      if (mk.length === 1) keys[q.id] = String.fromCharCode(65 + mk[0]);
    }

      const mk = q.stmts.filter(o => o.m).length;

    }

    if (s === 'p2') { out.stmts = q.stmts.map(o => ({ t: o.t, i: o.i })); while (out.stmts.length < 4) out.stmts.push({ t: '', i: [] }); }

    if (!t) return;

    else tgt.o.t += (tgt.o.t ? ' ' : '') + t;
  };
  const ingest = (txt, imgs, ln) => {
    const t = txt.trim();
    const km = t.match(/^(?:Đáp án|ĐÁP ÁN|Đ\/A)\s*(?:đúng)?\s*[:：]\s*([A-D])\b\.?\s*$/);
    if (km) { keys[cur.id] = km[1]; return; }

        S.items.forEach(x => { const o = { t: x.t, i: [], m: S.items.length === 1 ? ln.m || '' : '' }; cur.stmts.push(o); tgt = { k: 's', o }; });

}


/* ---------- Bảng đáp án theo mẫu Excel: cột A = số câu liên tục, các cột sau = mã đề ---------- */

    k++; const v = col[k];

    if (sec === 'p1') {

      if (/^[A-D]$/.test(L)) { keys[q.id] = L; n++; } else warn.push('Câu ' + k + ' (nhiều lựa chọn) cần A, B, C hoặc D, trong tệp là "' + v + '".');

/* ---------- Nhập đáp án hàng loạt ---------- */
function applyBulk(text, qs, keys, sec) {
  const arr = qs[sec] || []; let n = 0;
  const set = (i, v) => { if (arr[i]) { keys[arr[i].id] = v; n++; } };
  if (sec === 'p1') {
    const re = /(?:Câu\s*)?(\d{1,3})\s*[.:\-)=]*\s*([A-Da-d])(?![A-Za-zÀ-ỹ])/g; let m, found = false;
    while ((m = re.exec(text)) !== null) { set(parseInt(m[1], 10) - 1, m[2].toUpperCase()); found = true; }
    if (!found) { const seq = text.replace(/[^A-Da-d]/g, '').toUpperCase(); if (seq.length >= 2) [...seq].forEach((c, i) => set(i, c)); }
  } else if (sec === 'p2') {
    text.split(/\r?\n/).forEach(line => {
      const m = line.match(/(?:Câu\s*)?(\d{1,3})\s*[.:\-)=]*\s*((?:(?:[\s,;\-./|]|[a-d]\))*(?:[Đđ]úng|[Ss]ai|[ĐđSsTtFfDd])){2,8})/);
      if (!m) return;
      const toks = m[2].replace(/[a-d]\)/g, ' ').match(/[Đđ]úng|[Ss]ai|[ĐđSsTtFfDd]/g) || [];
      const vals = toks.map(x => /^(đúng|đ|t|d)$/i.test(x));
      if (vals.length >= 2) set(parseInt(m[1], 10) - 1, vals);
    });
  } else if (sec === 'p3') {
    text.split(/\r?\n/).forEach(line => {
      const m = line.match(/^\s*(?:Câu\s*)?(\d{1,3})\s*[.:)=\-]+\s*(.+)$/);
      if (!m) return;
      const vals = m[2].split(/\s*(?:;|\||\bhoặc\b)\s*/).map(s => s.trim()).filter(Boolean);
      if (vals.length) set(parseInt(m[1], 10) - 1, vals);
    });
  }

/* ---------- Đáp án theo mẫu Excel (hàng = số câu liên tục, cột = mã đề) ---------- */
async function xlsxRows(file) {
  const X = await lib('xlsx'), wb = X.read(await file.arrayBuffer(), { type: 'array' });
  return X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: true });
}
async function keyTemplate(qs, codes, keys) {
  const X = await lib('xlsx'), cs = codes && codes.length ? codes : ['Mã đề'];
  const rows = [['Câu\\Mã đề'].concat(cs)]; let n = 0;
  ['p1', 'p2', 'p3'].forEach(sec => (qs[sec] || []).forEach(q => {
    n++; const k = keys && keys[q.id]; let v = '';
    if (sec === 'p1' && k) v = k;
    else if (sec === 'p2' && Array.isArray(k)) v = k.map(x => (x ? 'Đ' : 'S')).join('');
    else if (sec === 'p3' && Array.isArray(k)) v = k.join('; ');
    rows.push([n].concat(cs.map(() => v)));
  }));
  const ws = X.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 12 }].concat(cs.map(() => ({ wch: 12 })));
  const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, 'Sheet1');
  return X.write(wb, { type: 'array', bookType: 'xlsx' });
}

function keyOK(sec, q, keys) {

  if (sec === 'p3') return Array.isArray(k) && k.some(x => String(x).trim());

CHG['an-stu'] = el => { A.ui.aStu = el.value; render(); };
function anClass(R, AN, rows) {
  let h = '<div class="tiles" style="margin-bottom:14px"><div class="tile"><small>Số bài</small><b>' + AN.n + '</b></div><div class="tile"><small>Điểm trung bình</small><b>' + fmt(AN.avg) + '</b></div><div class="tile"><small>Trung vị</small><b>' + fmt(AN.med) + '</b></div><div class="tile"><small>Cao nhất</small><b>' + fmt(AN.max) + '</b></div><div class="tile"><small>Thấp nhất</small><b>' + fmt(AN.min) + '</b></div><div class="tile"><small>Đạt (≥ 5)</small><b>' + AN.pass + '/' + AN.n + '</b></div></div>';
  const pend = rows.filter(r => r.g.pending).length; if (pend) h += '<div class="banner" style="margin-bottom:12px">Có ' + pend + ' bài chưa chấm tự luận, phần tự luận đó đang tính 0 điểm trong phân tích.</div>';
  const mxb = Math.max(1, ...AN.bins);
  h += '<div class="two"><section class="card"><h3>Phổ điểm</h3><div class="hist" role="img" aria-label="Biểu đồ phổ điểm">' + AN.bins.map((c, i) => '<div class="col"><em>' + (c || '') + '</em><i style="height:' + Math.round(c / mxb * 100) + '%"></i><span>' + (i === 9 ? '9–10' : i + '–' + (i + 1)) + '</span></div>').join('') + '</div><p class="small muted" style="margin-top:6px">Số học sinh theo từng khoảng điểm (thang 10).</p></section>' +
    '<section class="card"><h3>Xếp loại</h3><div style="margin-top:8px">' + Object.keys(AN.levels).map(k => bar(k, AN.n ? AN.levels[k] / AN.n : 0, k === 'Giỏi' ? 'g' : k === 'Khá' ? '' : k === 'Trung bình' ? 'a' : 'r', AN.levels[k] + ' em')).join('') + '</div><h3 style="margin-top:16px">Tỉ lệ điểm theo phần</h3><div style="margin-top:8px">' + SECS.filter(s => AN.secPct[s] != null).map(s => bar(secLabel(s), AN.secPct[s], pctCls(AN.secPct[s]))).join('') + '</div></section></div>';
  const hard = AN.qStats.filter(q => q.rate != null && q.sec !== 'p4' && q.cnt > 0).sort((a, b) => a.rate - b.rate).slice(0, 8);
  h += '<section class="card"><h3>Các câu khó nhất</h3><p class="small muted" style="margin:4px 0 10px">Câu có tỉ lệ làm đúng thấp nhất. Với phần I có thêm phương án các em chọn nhiều nhất.</p>' + (hard.length ? '<div class="tw"><table><thead><tr><th>Câu</th><th class="n">Tỉ lệ đúng</th><th>Đáp án đúng</th><th>Học sinh chọn (phần I)</th></tr></thead><tbody>' + hard.map(q => '<tr><td>' + SECT[q.sec].roman + '-' + q.no + '</td><td class="n"><b class="' + (q.rate < 0.5 ? 'bad-t' : '') + '">' + Math.round(q.rate * 100) + '%</b></td><td>' + esc(ansText(q.sec, { key: q.key }, null)[1]) + '</td><td class="chs">' + (q.sec === 'p1' ? Object.keys(q.ch).sort().map(k => '<span class="' + (k === q.key ? 'k' : '') + '">' + esc(k) + ': ' + q.ch[k] + '</span>').join('') : '') + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="muted">Chưa đủ dữ liệu.</p>') + '</section>';
  h += '<section class="card"><h3>Tỉ lệ đúng của từng câu</h3><div style="margin-top:8px">' + AN.qStats.filter(q => q.rate != null && q.sec !== 'p4').map(q => bar(SECT[q.sec].roman + '-' + q.no, q.rate, pctCls(q.rate))).join('') + '</div>' + (R.qs.p4.length ? '<p class="small muted" style="margin-top:10px">Tự luận: ' + AN.qStats.filter(q => q.sec === 'p4').map(q => 'Câu ' + q.no + ': ' + (q.rate == null ? '–' : Math.round(q.rate * 100) + '% điểm tối đa')).join(' · ') + '</p>' : '') + '</section>';
  const p2 = AN.qStats.filter(q => q.sec === 'p2' && q.st.some(z => z.n)); if (p2.length) h += '<section class="card"><h3>Phần II: tỉ lệ đúng theo từng ý</h3><div class="tw"><table><thead><tr><th>Câu</th>' + ['a', 'b', 'c', 'd'].map(x => '<th class="n">Ý ' + x + '</th>').join('') + '</tr></thead><tbody>' + p2.map(q => '<tr><td>II-' + q.no + '</td>' + q.st.map(z => '<td class="n">' + (z.n ? Math.round(z.ok / z.n * 100) + '%' : '–') + '</td>').join('') + '</tr>').join('') + '</tbody></table></div></section>';
  return h;
}
function anStudent(R, AN, rows) {
  const r = rows.find(x => x.id === A.ui.aStu), g = r.g, s10 = g.maxTotal ? g.total / g.maxTotal * 10 : 0, rank = rows.filter(x => x.g.total > g.total).length + 1;
  const ps = SECS.filter(s => g.max[s] > 0).map(s => ({ s, p: g.sec[s] / g.max[s], c: AN.secPct[s] }));
  const best = ps.slice().sort((a, b) => b.p - a.p)[0], worst = ps.slice().sort((a, b) => a.p - b.p)[0];
  let h = '<div class="tiles" style="margin-bottom:14px"><div class="tile"><small>Học sinh</small><b style="font-size:1.1rem">' + esc(r.n) + '</b></div><div class="tile"><small>Điểm</small><b class="score">' + fmt(g.total) + '</b></div><div class="tile"><small>Thang 10</small><b>' + fmt(s10) + '</b></div><div class="tile"><small>Xếp loại</small><b style="font-size:1.1rem">' + levelOf(s10) + '</b></div><div class="tile"><small>Thứ hạng</small><b>' + rank + '/' + rows.length + '</b></div><div class="tile"><small>So với TB lớp</small><b style="color:' + (s10 >= AN.avg ? 'var(--green)' : 'var(--red)') + '">' + (s10 >= AN.avg ? '+' : '') + fmt(s10 - AN.avg) + '</b></div></div>';
  h += '<section class="card"><h3>Điểm từng phần so với trung bình lớp</h3><div style="margin-top:10px">' + ps.map(x => bar(secLabel(x.s) + ' (em)', x.p, pctCls(x.p)) + bar('Trung bình lớp', x.c || 0, 'a')).join('<div style="height:8px"></div>') + '</div>' + (ps.length > 1 ? '<p style="margin-top:12px"><b>Nhận xét:</b> mạnh nhất ở <b>' + secLabel(best.s) + ' (' + SECT[best.s].short + ')</b> với ' + Math.round(best.p * 100) + '% số điểm; cần củng cố <b>' + secLabel(worst.s) + ' (' + SECT[worst.s].short + ')</b> với ' + Math.round(worst.p * 100) + '%.</p>' : '') + '</section>';
  const wrong = []; SECS.forEach(sec => (R.qs[sec] || []).forEach((q, i) => { const z = g.q[q.id]; if (sec !== 'p4' && !z.ok && !z.nokey) wrong.push({ sec, no: i + 1, z }); }));
  h += '<section class="card"><h3>Các câu làm chưa đúng (' + wrong.length + ')</h3>' + (wrong.length ? '<div class="tw"><table><thead><tr><th>Câu</th><th>Em chọn</th><th>Đáp án đúng</th><th class="n">Điểm</th><th class="n">Tỉ lệ đúng cả lớp</th></tr></thead><tbody>' + wrong.map(w => { const t = ansText(w.sec, w.z, null), st = AN.qStats.find(q => q.id === R.qs[w.sec][w.no - 1].id); return '<tr><td>' + SECT[w.sec].roman + '-' + w.no + '</td><td>' + esc(t[0]) + '</td><td>' + esc(t[1]) + '</td><td class="n">' + fmt(w.z.pts) + '/' + fmt(w.z.max) + '</td><td class="n">' + (st && st.rate != null ? Math.round(st.rate * 100) + '%' : '–') + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<p class="muted" style="margin-top:6px">Em làm đúng tất cả câu trắc nghiệm.</p>') + '</section>';
  return h;
}

/* ===== main.js: khởi động ===== */
function routeHash() {
  const m = /^#(lop|de)-([A-Za-z0-9]{4,8})(?:-([A-Za-z0-9]{4,8}))?$/.exec(location.hash || '');
  if (!m || !A.ready) return false;
  A.authed = false; stopTimer(); openCode(m[2].toUpperCase(), m[3] ? m[3].toUpperCase() : ''); return true;
}
window.addEventListener('hashchange', () => { if (!(A.stu && A.stu.step === 'taking')) routeHash(); });
(async function boot() {
  render();
  A.ready = true;
  if (!routeHash()) render();
  try { const c = A.ui; if (c) c.boot = 1; } catch (e) { /* bỏ qua */ }
})();


</script>
